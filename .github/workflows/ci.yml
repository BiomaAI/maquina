name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate empty Rust workspace
        run: cargo metadata --format-version 1 --no-deps
      - name: Build Lean specification
        uses: leanprover/lean-action@v1.5.0
        with:
          build: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: visualizer/pnpm-lock.yaml
      - name: Install visualizer dependencies
        working-directory: visualizer
        run: pnpm install --frozen-lockfile
      - name: Verify Lean-owned showcase artifacts
        working-directory: visualizer
        run: |
          pnpm generate
          git diff --exit-code -- public/generated
      - name: Test and build Maquina Playground
        working-directory: visualizer
        run: |
          pnpm test
          pnpm build
