name: Deploy Visualizer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Lean specification and exporters
        uses: leanprover/lean-action@v1.5.0
        with:
          build: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: visualizer/pnpm-lock.yaml
      - name: Install visualizer dependencies
        working-directory: visualizer
        run: pnpm install --frozen-lockfile
      - name: Generate and verify Lean-owned artifacts
        working-directory: visualizer
        run: |
          pnpm generate
          git diff --exit-code -- public/generated
          pnpm test
      - name: Build repository Pages site
        working-directory: visualizer
        env:
          VITE_MAQUINA_BASE: /maquina/
        run: pnpm build
      - name: Smoke-test Pages output
        working-directory: visualizer
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/generated/catalog.v3.json
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from "node:fs";
          const catalog = JSON.parse(readFileSync("dist/generated/catalog.v3.json", "utf8"));
          const expected = new Set([
            "catalog.v3.json",
            ...catalog.entries.map((entry) => entry.artifact.replace(/^generated\//, "")),
          ]);
          const actual = new Set(
            readdirSync("dist/generated").filter((name) => name.endsWith(".v3.json")),
          );
          if (expected.size !== actual.size || [...expected].some((name) => !actual.has(name))) {
            throw new Error(`generated artifacts do not match catalog: expected ${[...expected]}, got ${[...actual]}`);
          }
          NODE
          grep -q '/maquina/' dist/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: visualizer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy visualizer
        id: deployment
        uses: actions/deploy-pages@v5
